name: iOS unsigned IPA for sideload

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build identity
        run: |
          echo "ref=${{ github.ref }} sha=${{ github.sha }}"
          git log --oneline -3
          git describe --tags --always --dirty

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          xcodegen --version
          xcodebuild -list -project CameraApp.xcodeproj

      - name: Diagnose plist wiring
        run: |
          grep -n "INFOPLIST_FILE\|GENERATE_INFOPLIST" CameraApp.xcodeproj/project.pbxproj | head -20
          echo "--- Sources/Info.plist keys ---"
          grep -o "<key>[A-Za-z]*</key>" Sources/Info.plist | sort -u

      - name: Archive (unsigned for Sideloadly)
        run: |
          xcodebuild archive \
            -project CameraApp.xcodeproj \
            -scheme CameraApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/CameraApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" AD_HOC_CODE_SIGNING_ALLOWED=YES GENERATE_INFOPLIST_FILE=NO INFOPLIST_FILE="$(pwd)/Sources/Info.plist"

      - name: Merge privacy keys into built Info.plist
        run: |
          python3 - <<'EOF'
          import plistlib
          src = "Sources/Info.plist"
          dst = "build/CameraApp.xcarchive/Products/Applications/CameraApp.app/Info.plist"
          with open(src, "rb") as f:
              s = plistlib.load(f)
          with open(dst, "rb") as f:
              d = plistlib.load(f)
          print("BEFORE merge:")
          for k in ["CFBundleShortVersionString", "CFBundleVersion",
                    "NSCameraUsageDescription", "NSMicrophoneUsageDescription"]:
              print(f"  {k} = {d.get(k)!r}")
          keys = ["CFBundleDisplayName", "CFBundleShortVersionString", "CFBundleVersion",
                  "NSCameraUsageDescription", "NSMicrophoneUsageDescription",
                  "NSPhotoLibraryAddUsageDescription", "NSPhotoLibraryUsageDescription",
                  "UISupportedInterfaceOrientations", "UIRequiredDeviceCapabilities",
                  "UILaunchScreen", "ITSAppUsesNonExemptEncryption"]
          for k in keys:
              if k in s:
                  d[k] = s[k]
              else:
                  print(f"WARNING: {k} missing in {src}")
          with open(dst, "wb") as f:
              plistlib.dump(d, f)
          print("merged keys:")
          for k in keys:
              print(f"  {k} = {d.get(k)!r}")
          EOF

      - name: Verify privacy keys in built app
        run: |
          PLIST="build/CameraApp.xcarchive/Products/Applications/CameraApp.app/Info.plist"
          for KEY in NSCameraUsageDescription NSMicrophoneUsageDescription NSPhotoLibraryAddUsageDescription NSPhotoLibraryUsageDescription; do
            VAL=$(plutil -extract "$KEY" raw -o - "$PLIST" 2>&1) || { echo "::error::Missing $KEY in built Info.plist (TCC will kill the app on launch)"; plutil -p "$PLIST"; exit 1; }
            echo "$KEY = $VAL"
          done

      - name: Package unsigned IPA
        run: |
          rm -rf Payload CameraApp-unsigned.ipa
          mkdir -p Payload
          cp -R "build/CameraApp.xcarchive/Products/Applications/CameraApp.app" Payload/
          zip -r CameraApp-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CameraApp-unsigned-ipa
          path: CameraApp-unsigned.ipa

      - name: GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CameraApp-unsigned.ipa
          generate_release_notes: true
